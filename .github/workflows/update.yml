name: Scrape and deploy

on:
  schedule:
    - cron: "17 4 * * *" # daily, 04:17 UTC
  workflow_dispatch: # "Run workflow" button = refresh on demand
  push:
    branches: [main]
    paths: ["web/**", "scraper/**", "data/seed/**", ".github/workflows/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scrape-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      # Detail-page caches, per-source snapshots and the GeoNames gazetteer persist between runs,
      # so a daily run only downloads postings it has not seen before.
      - name: Restore scraper state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache
            data/snapshots
            data/geonames
          key: scraper-state-${{ github.run_id }}
          restore-keys: scraper-state-

      - name: Test scrapers
        working-directory: scraper
        run: python -m pytest -q

      - name: Scrape
        working-directory: scraper
        run: python -m jobfinder scrape

      - name: Save scraper state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache
            data/snapshots
            data/geonames
          key: scraper-state-${{ github.run_id }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
